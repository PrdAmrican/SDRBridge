[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sdrbridge"
dynamic = ["version"]
description = "Bridge SDRplay SDRconnect's WebSocket API (nRSP-ST etc.) to rtl_tcp, SoapySDR and raw IQ"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "PrdAmrican" }]
license = { text = "AGPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = ["numpy>=1.21", "websockets>=13"]

[project.scripts]
sdrbridge = "nrsp_bridge:main"

[tool.setuptools]
py-modules = ["nrsp_bridge"]

[tool.setuptools.dynamic]
# The one place the version lives is __version__ in nrsp_bridge.py.
version = { attr = "nrsp_bridge.__version__" }
